name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@f65b6bbe39e6d72110341476a2066e30b2adbf77
    with:
      version-files: |
        plugins/mindie-agent/pyproject.toml
        plugins/mindie-agent/.codex-plugin/plugin.json
      setup-command: |
        uv sync --project plugins/mindie-agent --locked --no-editable && uv pip install --python plugins/mindie-agent/.venv/bin/python pytest
      python: plugins/mindie-agent/.venv/bin/python
      test-command: |
        export MINDIE_CORE_REPO="$RUNNER_TEMP/release-knowledge"
        knowledge_sha=$(plugins/mindie-agent/.venv/bin/python -c 'import importlib.metadata as m,json; print(json.loads(m.distribution("mindie-knowledge").read_text("direct_url.json"))["vcs_info"]["commit_id"])')
        git clone --no-checkout --filter=blob:none https://github.com/mindie-agent/knowledge "$MINDIE_CORE_REPO"
        git -C "$MINDIE_CORE_REPO" checkout --detach "$knowledge_sha"
        plugins/mindie-agent/.venv/bin/python tests/preflight.py
        plugins/mindie-agent/.venv/bin/python -m pytest tests -q -m "not live_npu"
      build-command: |
        uv build --project plugins/mindie-agent --out-dir "$RELEASE_ASSETS_DIR"
        plugins/mindie-agent/.venv/bin/python plugins/mindie-agent/scripts/release_metadata.py --source plugins/mindie-agent --tests tests --revision "$GITHUB_SHA" > "$RELEASE_ASSETS_DIR/mindie-plugin-release.json"
