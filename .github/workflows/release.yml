name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@main
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
    with:
      release-notes-path: docs/releases/mindie-agent-codex-0.1.40.md
      version-files: |
        plugins/mindie-agent/pyproject.toml
        plugins/mindie-agent/.codex-plugin/plugin.json
      setup-command: |
        UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --project plugins/mindie-agent --locked --no-editable && uv pip install --python .venv/bin/python pytest
      python: .venv/bin/python
      test-command: |
        .venv/bin/python -m pytest tests -q -m "not live_npu"
      build-command: |
        uv build --project plugins/mindie-agent --out-dir "$RELEASE_ASSETS_DIR"
        .venv/bin/python plugins/mindie-agent/scripts/setup.py release-metadata --source plugins/mindie-agent --tests tests --revision "$GITHUB_SHA" > "$RELEASE_ASSETS_DIR/mindie-plugin-release.json"
