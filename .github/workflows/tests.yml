name: Adapter checks
on: [push, pull_request]
jobs:
  # Package/unit CI: bounded, model-free checks against the exact pinned
  # runtime and domain dependencies. This is not native desktop acceptance:
  # macOS hook-trust/plugin acceptance is run by the maintainer locally, and
  # Windows hardware acceptance is still pending.
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Real core tests import remote_dev; install the
      # exact commit pins instead of skipping modules or stubbing imports.
      - name: Install pinned runtime and domain dependencies
        run: python -m pip install -r runtime-requirements.txt
      # Contract tests archive these commits. They do not guess a sibling
      # checkout. Core d0538e5 is published first. Peer 90f73e7 is an ancestor
      # of review 86de2c3, so the peer checkout fails until that branch is published.
      - name: Checkout pinned core
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/knowledge
          ref: d0538e584c9e606cf9ff1952ba06747cb5c04966
          path: .ci/core
      - name: Checkout pinned peer adapter
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/mindie-agent-kimi
          ref: 90f73e76c6087ce091570f2d151b709145c913bc
          path: .ci/kimi
      - name: Core unit tests
        env:
          MINDIE_CORE_REPO: ${{ github.workspace }}/.ci/core
          MINDIE_KIMI_REPO: ${{ github.workspace }}/.ci/kimi
        run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q plugins/mindie-agent tests
