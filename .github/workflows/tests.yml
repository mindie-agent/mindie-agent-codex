name: Adapter checks
on: [push, pull_request]
jobs:
  # Package/unit CI: bounded, model-free checks against the exact pinned
  # runtime and domain dependencies. This is not native desktop acceptance:
  # macOS hook-trust/plugin acceptance is run by the maintainer locally, and
  # Windows hardware acceptance is still pending.
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Real core tests import remote_dev / mindie_coordinator; install the
      # exact commit pins instead of skipping modules or stubbing imports.
      - name: Install pinned runtime and domain dependencies
        run: python -m pip install -r runtime-requirements.txt -r domain-requirements.txt
      - name: Core unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q plugins/mindie-agent domains/triton-ascend tests
