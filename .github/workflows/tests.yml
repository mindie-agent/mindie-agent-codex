name: Adapter checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Package/unit CI: bounded, model-free checks against the exact pinned
  # runtime and domain dependencies. Linux and Windows run the same component
  # entry. Native model turns, hook trust and OS scheduler acceptance are
  # separate evidence; this job does not exercise remote NPU hardware.
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all committed Python
        run: python -m compileall -q plugins/mindie-agent tests
      # Real core tests import remote_dev; install the
      # exact commit pins instead of skipping modules or stubbing imports.
      - name: Install pinned runtime and domain dependencies
        run: python -m pip install -r runtime-requirements.txt
      # Contract tests archive these commits. They do not guess a sibling
      # checkout. Publish the exact core and peer revisions before adapter CI.
      # Peer 90f73e7 is an ancestor of the reviewed Kimi 86de2c3 revision.
      - name: Checkout pinned core
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/knowledge
          ref: 8aaa8b0a7f25c7a6f5e756dc7b42cd5985312809
          path: .ci/core
      - name: Checkout pinned peer adapter
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/mindie-agent-kimi
          ref: 90f73e76c6087ce091570f2d151b709145c913bc
          path: .ci/kimi
      - name: Pin preflight
        env:
          MINDIE_CORE_REPO: ${{ github.workspace }}/.ci/core
          MINDIE_KIMI_REPO: ${{ github.workspace }}/.ci/kimi
        run: python tests/preflight.py
      - name: Pinned runtime probe
        env:
          MINDIE_CORE_REPO: ${{ github.workspace }}/.ci/core
          MINDIE_KIMI_REPO: ${{ github.workspace }}/.ci/kimi
        run: python -m unittest discover -s tests -p test_runtime_compatibility.py
      - name: Native Windows ownership and first-use lock
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_windows_process_tree tests.test_windows_consent_lock -v
      - name: Unicode installation and wire contracts
        run: python -m unittest tests.test_unicode_install tests.test_protocol_encoding -v
      - name: Real service lifetime
        run: python -m unittest tests.test_service_handoff -v
      - name: Product configuration outcomes
        run: python -m unittest tests.test_product_flow tests.test_organizer_model -v
      - name: Component tests
        env:
          # Preserve the host's native encoding so the harness cannot hide
          # implicit text I/O. Protocol encoding belongs to product code.
          PYTHONUTF8: '0'
          MINDIE_CORE_REPO: ${{ github.workspace }}/.ci/core
          MINDIE_KIMI_REPO: ${{ github.workspace }}/.ci/kimi
        run: python -m unittest discover -s tests -p 'test_*.py'
