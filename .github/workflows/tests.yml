name: Adapter checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Package/unit CI: bounded, model-free checks against the exact pinned
  # runtime and domain dependencies. Linux and Windows run the same component
  # entry. Native model turns, hook trust and OS scheduler acceptance are
  # separate evidence; this job does not exercise remote NPU hardware.
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The legacy-module regression uses `git archive v0.1.8`/`v0.1.9`.
          # A shallow checkout does not fetch those tags.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The native plugin payload must not contain an interpreter environment.
      - name: Set external runtime directory
        run: python -c "import os; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'mindie-codex-ci-runtime'; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('UV_PROJECT_ENVIRONMENT='+str(p)+'\n')"
      - name: Compile all committed Python
        run: python -m compileall -q plugins/mindie-agent tests
      # Real core tests import remote_dev; install the
      # exact commit pins instead of skipping modules or stubbing imports.
      - name: Install uv
        run: python -m pip install uv
      # mindie-sim ships observation sources up to 185 characters deep
      # (data/observations/sources/fla-a4a7958/...). uv checks that tree out
      # under %LOCALAPPDATA%\uv\cache\git-v1\checkouts\<digest>\<short-sha>\.
      # On windows-latest that absolute path is ~271 characters, and
      # `git reset --hard` exits 128 with "Filename too long"
      # (https://github.com/mindie-agent/mindie-agent-codex/actions/runs/42001245757).
      # bootstrap.py already passes process-scoped core.longpaths into its own
      # uv sync; this direct CI sync has to do the same. Hosted images already
      # set LongPathsEnabled=1, but Git for Windows still refuses the checkout
      # until core.longpaths is on. UV_CACHE_DIR is the same short prefix the
      # native-harness job uses, so tools that never opt into long paths stay
      # inside MAX_PATH for this tree. Both settings stay on this step: later
      # tests must still observe an unset GIT_CONFIG_COUNT.
      - name: Install locked noneditable product
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=core.longpaths
            export GIT_CONFIG_VALUE_0=true
            export UV_CACHE_DIR="${RUNNER_TEMP}/uv-cache"
          fi
          uv sync --project plugins/mindie-agent --locked --no-editable
      - name: Install component test collector
        run: uv run --project plugins/mindie-agent --no-sync python -c "import subprocess,sys; subprocess.run(['uv','pip','install','--python',sys.executable,'pytest==9.1.1'],check=True)"
      - name: Validate release compatibility and registered Harness interfaces
        run: uv run --project plugins/mindie-agent --no-sync python plugins/mindie-agent/scripts/release_metadata.py --source plugins/mindie-agent --tests tests --revision "${{ github.sha }}"
      # Contract tests archive these commits. They do not guess a sibling
      # checkout. Publish the exact core and peer revisions before adapter CI.
      # Peer 90f73e7 is an ancestor of the reviewed Kimi 86de2c3 revision.
      - name: Read product runtime pin
        id: product
        shell: bash
        run: |
          python -c 'import os,sys; sys.path.insert(0,"plugins/mindie-agent/scripts"); from product_contract import requirements; open(os.environ["GITHUB_OUTPUT"],"a").write("knowledge="+requirements(".")[0]["mindie-knowledge"]+"\n")'
      - name: Checkout pinned core
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/knowledge
          ref: ${{ steps.product.outputs.knowledge }}
          path: .ci/core
      - name: Checkout pinned peer adapter
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/mindie-agent-kimi
          ref: 90f73e76c6087ce091570f2d151b709145c913bc
          path: .ci/kimi
      - name: Pin preflight
        env:
          MINDIE_CORE_REPO: ${{ github.workspace }}/.ci/core
          MINDIE_KIMI_REPO: ${{ github.workspace }}/.ci/kimi
        run: uv run --project plugins/mindie-agent --no-sync python tests/preflight.py
      - name: Contract-first component tests (each case once)
        env:
          # Preserve the host's native encoding so the harness cannot hide
          # implicit text I/O. Protocol encoding belongs to product code.
          PYTHONUTF8: '0'
          MINDIE_CORE_REPO: ${{ github.workspace }}/.ci/core
          MINDIE_KIMI_REPO: ${{ github.workspace }}/.ci/kimi
        run: uv run --project plugins/mindie-agent --no-sync python tests/run_ci.py

  native-harness:
    # Model-free native management and MCP discovery; no account or NPU needed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        codex: ["0.162.1", "0.164.0", "0.166.0"]
        include:
          - os: windows-latest
            codex: "0.166.0"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the exact native host and locked runtime
        run: |
          npm install -g "@openai/codex@${{ matrix.codex }}"
          python -m pip install uv
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/mindie-native-runtime" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          python -c 'import os,pathlib,shutil; p=pathlib.Path(shutil.which("codex")).resolve(); native=next(p.parent.glob("node_modules/@openai/codex/vendor/*/bin/codex.exe"),p); open(os.environ["GITHUB_ENV"],"a").write("MINDIE_TEST_CODEX_BIN="+str(native)+"\n")'
      - name: Prepare locked component dependencies
        shell: bash
        run: |
          # Same mindie-sim checkout as the adapter job. UV_CACHE_DIR above
          # keeps today's paths under MAX_PATH; core.longpaths covers a longer
          # observation filename without flipping the succeeded install into
          # a Windows-only failure. Step-scoped so acceptance tests still see
          # an unset GIT_CONFIG_COUNT.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=core.longpaths
            export GIT_CONFIG_VALUE_0=true
          fi
          uv sync --project plugins/mindie-agent --locked --no-editable
          uv run --project plugins/mindie-agent --no-sync python -c 'import subprocess,sys; subprocess.run(["uv","pip","install","--python",sys.executable,"pytest==9.1.1"],check=True)'
      - name: Native plugin, hook trust, SessionStart and MCP acceptance
        run: uv run --project plugins/mindie-agent --no-sync python -m pytest -q -s --tb=short tests/test_native_harness_acceptance.py
