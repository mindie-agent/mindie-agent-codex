name: Adapter checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Package/unit CI: bounded, model-free checks against the exact pinned
  # runtime and domain dependencies. Linux and Windows run the same component
  # entry. Native model turns, hook trust and OS scheduler acceptance are
  # separate evidence; this job does not exercise remote NPU hardware.
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The legacy-module regression uses `git archive v0.1.8`/`v0.1.9`.
          # A shallow checkout does not fetch those tags.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The native plugin payload must not contain an interpreter environment.
      - name: Set external runtime directory
        run: python -c "import os; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'mindie-codex-ci-runtime'; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('UV_PROJECT_ENVIRONMENT='+str(p)+'\n')"
      - name: Compile all committed Python
        run: python -m compileall -q plugins/mindie-agent tests
      # Real core tests import remote_dev; install the
      # exact commit pins instead of skipping modules or stubbing imports.
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked noneditable product
        run: uv sync --project plugins/mindie-agent --locked --no-editable
      - name: Install component test collector
        run: uv run --project plugins/mindie-agent --no-sync python -c "import subprocess,sys; subprocess.run(['uv','pip','install','--python',sys.executable,'pytest==9.1.1'],check=True)"
      - name: Validate release compatibility and registered Harness interfaces
        run: uv run --project plugins/mindie-agent --no-sync python plugins/mindie-agent/scripts/release_metadata.py --source plugins/mindie-agent --tests tests --revision "${{ github.sha }}"
      # Contract tests archive these commits. They do not guess a sibling
      # checkout. Publish the exact core and peer revisions before adapter CI.
      # Peer 90f73e7 is an ancestor of the reviewed Kimi 86de2c3 revision.
      - name: Read product runtime pin
        id: product
        shell: bash
        run: |
          python -c 'import os,sys; sys.path.insert(0,"plugins/mindie-agent/scripts"); from product_contract import requirements; open(os.environ["GITHUB_OUTPUT"],"a").write("knowledge="+requirements(".")[0]["mindie-knowledge"]+"\n")'
      - name: Checkout pinned core
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/knowledge
          ref: ${{ steps.product.outputs.knowledge }}
          path: .ci/core
      - name: Checkout pinned peer adapter
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/mindie-agent-kimi
          ref: 90f73e76c6087ce091570f2d151b709145c913bc
          path: .ci/kimi
      - name: Pin preflight
        env:
          MINDIE_CORE_REPO: ${{ github.workspace }}/.ci/core
          MINDIE_KIMI_REPO: ${{ github.workspace }}/.ci/kimi
        run: uv run --project plugins/mindie-agent --no-sync python tests/preflight.py
      - name: Contract-first component tests (each case once)
        env:
          # Preserve the host's native encoding so the harness cannot hide
          # implicit text I/O. Protocol encoding belongs to product code.
          PYTHONUTF8: '0'
          MINDIE_CORE_REPO: ${{ github.workspace }}/.ci/core
          MINDIE_KIMI_REPO: ${{ github.workspace }}/.ci/kimi
        run: uv run --project plugins/mindie-agent --no-sync python tests/run_ci.py
