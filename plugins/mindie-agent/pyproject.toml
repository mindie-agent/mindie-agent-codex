[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-codex"
version = "0.1.14"
description = "Codex adapter for MindIE Agent"
requires-python = ">=3.11"
dependencies = ["mindie-knowledge", "remote-dev", "mindie-diagnostics"]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "9a4325858e6fadb10715275826a7795843cbbdf4" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "85be999811771e03ecc7d78e5e560fac1636e7ef" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "5ae643e19223f2181ecdbaa3edaf464137c4805e" }

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = ["mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@5ae643e19223f2181ecdbaa3edaf464137c4805e"]

[tool.setuptools]
packages = ["mindie_codex", "mindie_codex.scripts"]
package-dir = { mindie_codex = "." }
include-package-data = false

[tool.setuptools.package-data]
mindie_codex = [
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
  ".codex-plugin/plugin.json", ".mcp.json",
  "hooks/*.json", "skills/*/*.md", "skills/*/agents/*.yaml",
  "skills/*/references/*.md", "skills/*/assets/*", "assets/*", "scripts/*.json"
]
