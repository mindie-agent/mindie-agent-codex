[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-codex"
version = "0.1.26"
description = "Codex adapter for MindIE Agent"
requires-python = ">=3.11"
dependencies = [
  "mindie-knowledge",
  "remote-dev",
  "mindie-diagnostics",
  "mindie-debugger",
  "mindie-profiler",
  "mindie-sim",
  "mindie-coordinator",
]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "ac4a89e993c89deba5a4a629e1cd89d61e57c843" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "6a64da8be9ed7c0bb38c2ba57f539da9a43ddf34" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "25182e651860fb354a78968fe6b7590f14b14593" }
mindie-debugger = { git = "https://github.com/mindie-agent/debugger", rev = "e9406b2b178335190d5cb59dff4d6985894497ba" }
mindie-profiler = { git = "https://github.com/mindie-agent/profiler", rev = "968909942da1706f4bf579eb77c17aa9131bb50b" }
mindie-sim = { git = "https://github.com/mindie-agent/sim", rev = "d71ab7479da1df86bc397d635b23ee214cbfa47c" }
mindie-coordinator = { git = "https://github.com/mindie-agent/coordinator", rev = "8690fdd065c73adab8dae2542d6a374f2ecab59e" }

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@25182e651860fb354a78968fe6b7590f14b14593",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@d71ab7479da1df86bc397d635b23ee214cbfa47c",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@6a64da8be9ed7c0bb38c2ba57f539da9a43ddf34",
]

[tool.hatch.build.targets.wheel]
# Stream the payload into the wheel; a nested setuptools bdist staging tree
# exceeds Windows relative-path limits at the native component-generation depth.
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
sources = { "" = "mindie_codex" }

[tool.hatch.build.targets.sdist]
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
