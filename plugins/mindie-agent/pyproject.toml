[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-codex"
version = "0.1.2"
description = "Codex adapter for MindIE Agent"
requires-python = ">=3.11"
dependencies = ["mindie-knowledge", "remote-dev", "mindie-diagnostics"]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "38a42f6f778cfa555d8918fdcacd12cee4a181f5" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "0463a13fce9618ec9a51904869d61acb0cdb8538" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "801a01b2789aed7f58e971a909205a7d40b61077" }

[tool.setuptools]
packages = ["mindie_codex", "mindie_codex.scripts"]
package-dir = { mindie_codex = "." }
include-package-data = false

[tool.setuptools.package-data]
mindie_codex = [
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
  ".codex-plugin/plugin.json", ".mcp.json",
  "hooks/*.json", "skills/*/*.md", "skills/*/agents/*.yaml",
  "skills/*/references/*.md", "skills/*/assets/*", "assets/*", "scripts/*.json"
]
