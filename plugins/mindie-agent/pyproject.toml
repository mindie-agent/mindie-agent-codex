[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-codex"
version = "0.0.3"
description = "Codex adapter for MindIE Agent"
requires-python = ">=3.11"
dependencies = ["mindie-knowledge", "remote-dev", "mindie-diagnostics"]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "880c9f71f55aabd9e3a2a015e94524d6d9b54c9c" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "6bd1a15380195a95d450458e7c1856905d95bf73" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "fba07e8607ddadde14cea315c9dbda23726c1c79" }

[tool.setuptools]
packages = ["mindie_codex", "mindie_codex.scripts"]
package-dir = { mindie_codex = "." }
include-package-data = false

[tool.setuptools.package-data]
mindie_codex = [
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
  ".codex-plugin/plugin.json", ".mcp.json",
  "hooks/*.json", "skills/*/*.md", "skills/*/agents/*.yaml",
  "skills/*/references/*.md", "skills/*/assets/*", "assets/*", "scripts/*.json"
]
