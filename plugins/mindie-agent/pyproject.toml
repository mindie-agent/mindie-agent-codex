[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-codex"
version = "0.1.31"
description = "Codex adapter for MindIE Agent"
requires-python = ">=3.11"
dependencies = [
  "mindie-knowledge",
  "remote-dev",
  "mindie-diagnostics",
  "mindie-debugger",
  "mindie-profiler",
  "mindie-sim",
  "mindie-coordinator",
]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "315fc4bc51ee9a7afef32a3666599d608ff59f9d" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "3556df571450dab481a25e0157167f1c3727dc6c" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "171623584aa812677df907518dcb55b06493241b" }
mindie-debugger = { git = "https://github.com/mindie-agent/debugger", rev = "d40a250e4048ac63d4a478a5dbfa993702ceddd0" }
mindie-profiler = { git = "https://github.com/mindie-agent/profiler", rev = "f7dbca5e643db52807e12649e02291069f3d9d82" }
mindie-sim = { git = "https://github.com/mindie-agent/sim", rev = "f0f76b0b56830a0315c108efe90bcf131d3701ce" }
mindie-coordinator = { git = "https://github.com/mindie-agent/coordinator", rev = "d8977114e8cd0e5b7befa59a5ff5e53f40a74521" }

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@171623584aa812677df907518dcb55b06493241b",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@f0f76b0b56830a0315c108efe90bcf131d3701ce",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@3556df571450dab481a25e0157167f1c3727dc6c",
]

[tool.hatch.build.targets.wheel]
# Stream the payload into the wheel; a nested setuptools bdist staging tree
# exceeds Windows relative-path limits at the native component-generation depth.
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
sources = { "" = "mindie_codex" }

[tool.hatch.build.targets.sdist]
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
