[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-codex"
version = "0.1.37"
description = "Codex adapter for MindIE Agent"
requires-python = ">=3.11"
dependencies = [
  "mindie-harness",
  "mindie-knowledge",
  "remote-dev",
  "mindie-diagnostics",
  "mindie-debugger",
  "mindie-profiler",
  "mindie-sim",
  "mindie-coordinator",
]

[tool.mindie.substrate]
package = "mindie-harness"
min_version = "0.1.0"
seed = "assets/mindie-harness-seed.pyz"
seed_lock = "assets/seed-lock.json"

[tool.uv.sources]
mindie-harness = { git = "https://github.com/mindie-agent/harness", rev = "f05569947dbf0131061d8698bb779d024df0c43b" }
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "8fe8455669e88ef6963314332422653841518900" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "64c5a8d0ca9fe344e7af05f89fc0de6249f2368a" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "54ac7c03c78f9e02f379051d1613a4427559e10d" }
mindie-debugger = { git = "https://github.com/mindie-agent/debugger", rev = "e15c2ed38d8f928db67c5bb1a94269f62207227c" }
mindie-profiler = { git = "https://github.com/mindie-agent/profiler", rev = "b702893129724b852c5abcb8971724b8b0a6e870" }
mindie-sim = { git = "https://github.com/mindie-agent/sim", rev = "83fb8288aa998e0a6ad345ca7a16269f0181545b" }
mindie-coordinator = { git = "https://github.com/mindie-agent/coordinator", rev = "a3c7336faa0bc14ebdb8f2fd75606c82e96422e9" }

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-harness @ git+https://github.com/mindie-agent/harness@f05569947dbf0131061d8698bb779d024df0c43b",
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@8fe8455669e88ef6963314332422653841518900",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@64c5a8d0ca9fe344e7af05f89fc0de6249f2368a",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@54ac7c03c78f9e02f379051d1613a4427559e10d",
  "mindie-debugger @ git+https://github.com/mindie-agent/debugger@e15c2ed38d8f928db67c5bb1a94269f62207227c",
  "mindie-profiler @ git+https://github.com/mindie-agent/profiler@b702893129724b852c5abcb8971724b8b0a6e870",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@83fb8288aa998e0a6ad345ca7a16269f0181545b",
  "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@a3c7336faa0bc14ebdb8f2fd75606c82e96422e9",
]

[tool.hatch.build.targets.wheel]
# Stream the payload into the wheel; a nested setuptools bdist staging tree
# exceeds Windows relative-path limits at the native component-generation depth.
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
sources = { "" = "mindie_codex" }

[tool.hatch.build.targets.sdist]
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
