[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-codex"
version = "0.1.29"
description = "Codex adapter for MindIE Agent"
requires-python = ">=3.11"
dependencies = [
  "mindie-knowledge",
  "remote-dev",
  "mindie-diagnostics",
  "mindie-debugger",
  "mindie-profiler",
  "mindie-sim",
  "mindie-coordinator",
]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "1d0e413a2852007b46275a123fa1cce7be7b90d0" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "6e9882e0fa495bf2feeef29ec86492498d364531" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "37ed7f04a47eae8097cc286335186c3fcd9584b3" }
mindie-debugger = { git = "https://github.com/mindie-agent/debugger", rev = "e9406b2b178335190d5cb59dff4d6985894497ba" }
mindie-profiler = { git = "https://github.com/mindie-agent/profiler", rev = "f7dbca5e643db52807e12649e02291069f3d9d82" }
mindie-sim = { git = "https://github.com/mindie-agent/sim", rev = "f0f76b0b56830a0315c108efe90bcf131d3701ce" }
mindie-coordinator = { git = "https://github.com/mindie-agent/coordinator", rev = "db9b0c6432001d6049056eabd37422d0bfb9f75a" }

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@37ed7f04a47eae8097cc286335186c3fcd9584b3",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@f0f76b0b56830a0315c108efe90bcf131d3701ce",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@6e9882e0fa495bf2feeef29ec86492498d364531",
]

[tool.hatch.build.targets.wheel]
# Stream the payload into the wheel; a nested setuptools bdist staging tree
# exceeds Windows relative-path limits at the native component-generation depth.
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
sources = { "" = "mindie_codex" }

[tool.hatch.build.targets.sdist]
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
