[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-codex"
version = "0.1.40"
description = "Codex adapter for MindIE Agent"
requires-python = ">=3.11"
dependencies = [
  "mindie-harness>=0.1.8",
  "mindie-knowledge",
  "remote-dev",
  "mindie-diagnostics",
  "mindie-debugger",
  "mindie-profiler",
  "mindie-sim",
  "mindie-coordinator",
  "npu-top>=0.3.0",
]

[tool.mindie.substrate]
package = "mindie-harness"
min_version = "0.1.0"
seed = "assets/mindie-harness-seed.pyz"
seed_lock = "assets/seed-lock.json"

[tool.uv.sources]
mindie-harness = { git = "https://github.com/mindie-agent/harness", rev = "99962f4138f1402024a6d7b4b2596baaa36a4b00" }
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "9befde292ea0e6c79e9e5f475c266cbcf845d59a" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "784fc2ca1db172f683889a6d47543c37141b3278" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "7464cbb4381e9dc996871d192eb3f05f61dfdb28" }
mindie-debugger = { git = "https://github.com/mindie-agent/debugger", rev = "e15c2ed38d8f928db67c5bb1a94269f62207227c" }
mindie-profiler = { git = "https://github.com/mindie-agent/profiler", rev = "b702893129724b852c5abcb8971724b8b0a6e870" }
mindie-sim = { git = "https://github.com/mindie-agent/sim", rev = "83fb8288aa998e0a6ad345ca7a16269f0181545b" }
mindie-coordinator = { git = "https://github.com/mindie-agent/coordinator", rev = "79df7c373bf35fda2a94907d1f3beb51c6462357" }
npu-top = { git = "https://github.com/mindie-agent/npu-top", rev = "72654fe6047df6ccc67746c242b3ce18bcabc945" }

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-harness @ git+https://github.com/mindie-agent/harness@99962f4138f1402024a6d7b4b2596baaa36a4b00",
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@9befde292ea0e6c79e9e5f475c266cbcf845d59a",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@784fc2ca1db172f683889a6d47543c37141b3278",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@7464cbb4381e9dc996871d192eb3f05f61dfdb28",
  "mindie-debugger @ git+https://github.com/mindie-agent/debugger@e15c2ed38d8f928db67c5bb1a94269f62207227c",
  "mindie-profiler @ git+https://github.com/mindie-agent/profiler@b702893129724b852c5abcb8971724b8b0a6e870",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@83fb8288aa998e0a6ad345ca7a16269f0181545b",
  "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@79df7c373bf35fda2a94907d1f3beb51c6462357",
  "npu-top @ git+https://github.com/mindie-agent/npu-top@72654fe6047df6ccc67746c242b3ce18bcabc945",
]

[tool.hatch.build.targets.wheel]
# Stream the payload into the wheel; a nested setuptools bdist staging tree
# exceeds Windows relative-path limits at the native component-generation depth.
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
sources = { "" = "mindie_codex" }

[tool.hatch.build.targets.sdist]
only-include = [
  "__init__.py", "scripts", "assets", "hooks", "skills", ".codex-plugin", ".mcp.json",
  "pyproject.toml", "uv.lock", "product-contract.json", "harness-compatibility.json",
]
